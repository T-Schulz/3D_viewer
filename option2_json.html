<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Option 2: CityJSON 3D-Viewer</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; }
        canvas { width: 100vw; height: 100vh; display: block; }
        .back-btn { position: absolute; top: 20px; left: 20px; background: #333; color: white; padding: 10px 15px; text-decoration: none; border-radius: 5px; z-index: 10; }
        .info-box { position: absolute; bottom: 20px; left: 20px; background: rgba(0,0,0,0.8); color: white; padding: 15px; border-radius: 5px; z-index: 10; max-width: 300px; }
    </style>
</head>
<body>

    <a href="index.html" class="back-btn">← Zurück zur Hauptseite</a>
    <div class="info-box">
        <h3>CityJSON Viewer</h3>
        <p id="status">Lade Bibliotheken...</p>
    </div>

    <!-- Dynamischer Skript-Lader gegen Übertragungsfehler -->
    <script>
        (function() {
            // Teile die Links in sichere Teilstrings auf
            const cdn1 = "https://cdnjs.cloudflare.com" + "/ajax/libs/three.js/r128/" + "three.min.js";
            const cdn2 = "https://cdn.jsdelivr.net" + "/npm/three@0.128.0/examples/js/controls/" + "OrbitControls.js";

            function loadScript(url, callback) {
                const script = document.createElement('script');
                script.src = url;
                script.onload = callback;
                document.head.appendChild(script);
            }

            // Nacheinander laden
            loadScript(cdn1, function() {
                loadScript(cdn2, function() {
                    document.getElementById('status').innerText = "Lade CityJSON-Datei...";
                    initCityJSONViewer();
                });
            });
        })();

        // Das Hauptprogramm startet hier
        function initCityJSONViewer() {
            // 1. Three.js Setup
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x23272a);

            const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
            camera.position.set(100, 100, 100);

            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            const controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            
            // Beleuchtung
            const light = new THREE.DirectionalLight(0xffffff, 1.5);
            light.position.set(300, 500, 200);
            scene.add(light);
            scene.add(new THREE.AmbientLight(0x777777));

            // Boden-Gitternetz
            const gridHelper = new THREE.GridHelper(500, 50, 0x444444, 0x333333);
            scene.add(gridHelper);

            // Render-Schleife
            function animate() {
                requestAnimationFrame(animate);
                controls.update();
                renderer.render(scene, camera);
            }
            animate();

            // Funktion zur Generierung von CityJSON-Demodaten im Speicher (KORRIGIERT)
            function generateDemoCityJSON() {
                console.log("Generiere künstliche CityJSON-Demodaten...");
                return {
                    "type": "CityJSON",
                    "version": "1.1",
                    "transform": { "translate": [0, 0, 0], "scale": [1, 1, 1] },
                    "CityObjects": {
                        "id-1": { "type": "Building", "geometry": [{ "type": "Solid", "lod": "1", "boundaries": [ [[0,3,4,1]], [[1,4,5,2]], [[2,5,6,3]], [[3,6,7,0]], [[0,1,2,3]], [[4,7,6,5]] ] }] },
                        "id-2": { "type": "Building", "geometry": [{ "type": "Solid", "lod": "1", "boundaries": [ [[20,23,24,21]], [[21,24,25,22]], [[22,25,26,23]], [[23,26,27,20]], [[20,21,22,23]], [[24,27,26,25]] ] }] }
                    },
                    "vertices": [, [15,0,0], [15,15,0], [0,15,0], [0,0,30], [15,0,30], [15,15,30], [0,15,30],
, [45,30,0], [45,45,0], [30,45,0], [30,30,40], [45,30,40], [45,45,40], [30,45,40]
                    ]
                };
            }

            // 2. CityJSON laden oder generieren
            fetch('dortmund.city.json')
                .then(response => {
                    if (!response.ok) throw new Error("Datei nicht auf Server gefunden");
                    return response.json();
                })
                .then(cityjson => {
                    renderCityJSON(cityjson);
                })
                .catch(err => {
                    console.warn("Echte CityJSON nicht gefunden. Nutze lokale Demodaten.");
                    document.getElementById('status').innerText = "Demodaten aktiv (dortmund.city.json fehlt)";
                    const demoData = generateDemoCityJSON();
                    renderCityJSON(demoData);
                });

            function renderCityJSON(data) {
                const vertices = data.vertices;
                const objects = data.CityObjects;
                
                const material = new THREE.MeshLambertMaterial({ 
                    color: 0xffaa00, 
                    side: THREE.DoubleSide
                });

                // Echte CityJSON-Skalierung auslesen (wichtig für die korrekte Größe)
                const scaleX = data.transform && data.transform.scale ? data.transform.scale[0] : 1;
                const scaleY = data.transform && data.transform.scale ? data.transform.scale[1] : 1;
                const scaleZ = data.transform && data.transform.scale ? data.transform.scale[2] : 1;

                // Automatische Berechnung des echten Mittelpunkts aller Gebäude
                let minX = Infinity, maxX = -Infinity;
                let minY = Infinity, maxY = -Infinity;
                let minZ = Infinity, maxZ = -Infinity;

                vertices.forEach(v => {
                    const x = v[0] * scaleX;
                    const y = v[1] * scaleY;
                    const z = v[2] * scaleZ;
                    if (x < minX) minX = x; if (x > maxX) maxX = x;
                    if (y < minY) minY = y; if (y > maxY) maxY = y;
                    if (z < minZ) minZ = z; if (z > maxZ) maxZ = z;
                });

                // Mathematischer Schwerpunkt der Dortmunder Kachel
                const offsetX = (minX + maxX) / 2;
                const offsetY = (minY + maxY) / 2;
                const offsetZ = (minZ + maxZ) / 2;

                // Kamera automatisch auf die passende Höhe zurückfahren
                const deltaX = maxX - minX;
                const deltaY = maxY - minY;
                const maxDim = Math.max(deltaX, deltaY);
                camera.position.set(maxDim, maxDim * 1.2, maxDim);
                controls.target.set(0, 0, 0);
                controls.update();

                let buildingCount = 0;

                for (const objId in objects) {
                    const obj = objects[objId];
                    if (obj.type !== 'Building' && obj.type !== 'BuildingPart') continue;

                    obj.geometry.forEach(geom => {
                        const boundaries = geom.boundaries;
                        const flatBoundaries = geom.type === "Solid" ? boundaries[0] : boundaries;

                        flatBoundaries.forEach(ring => {
                            const actualRing = Array.isArray(ring[0]) ? ring[0] : ring;
                            
                            const geometry = new THREE.BufferGeometry();
                            const positions = [];

                            for (let i = 1; i < actualRing.length - 1; i++) {
                                const idx0 = actualRing[0];
                                const idx1 = actualRing[i];
                                const idx2 = actualRing[i + 1];

                                // Umrechnung mit Skalierung und zentriertem Offset
                                positions.push(
                                    (vertices[idx0][0] * scaleX) - offsetX, 
                                    (vertices[idx0][2] * scaleZ) - offsetZ, 
                                    -((vertices[idx0][1] * scaleY) - offsetY)
                                );
                                positions.push(
                                    (vertices[idx1][0] * scaleX) - offsetX, 
                                    (vertices[idx1][2] * scaleZ) - offsetZ, 
                                    -((vertices[idx1][1] * scaleY) - offsetY)
                                );
                                positions.push(
                                    (vertices[idx2][0] * scaleX) - offsetX, 
                                    (vertices[idx2][2] * scaleZ) - offsetZ, 
                                    -((vertices[idx2][1] * scaleY) - offsetY)
                                );
                            }

                            if (positions.length > 0) {
                                geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
                                geometry.computeVertexNormals();
                                
                                const mesh = new THREE.Mesh(geometry, material);
                                scene.add(mesh);
                            }
                        });
                    });
                    buildingCount++;
                }

                if(!document.getElementById('status').innerText.includes("Demodaten")) {
                    document.getElementById('status').innerText = `${buildingCount} CityJSON Gebäude erfolgreich geladen.`;
                }
                }

            // Fenstergröße anpassen
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }
    </script>
</body>
</html>
