<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Option 3: CSV Parser Viewer</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; }
        canvas { width: 100vw; height: 100vh; display: block; }
        .back-btn { position: absolute; top: 20px; left: 20px; background: #333; color: white; padding: 10px 15px; text-decoration: none; border-radius: 5px; z-index: 10; }
        .info-box { position: absolute; bottom: 20px; left: 20px; background: rgba(0,0,0,0.7); color: white; padding: 15px; border-radius: 5px; z-index: 10; }
    </style>
</head>
<body>

    <a href="index.html" class="back-btn">← Zurück zur Hauptseite</a>
    <div class="info-box">
        <h3>CSV 3D-Viewer</h3>
        <p id="status">Lade CSV-Daten...</p>
    </div>

    <!-- Dynamischer Skript-Lader gegen Übertragungsfehler -->
    <script>
        (function() {
            // Teile die Links in sichere Teilstrings auf
            const cdn1 = "https://cdnjs.cloudflare.com" + "/ajax/libs/three.js/r128/" + "three.min.js";
            const cdn2 = "https://cdn.jsdelivr.net" + "/npm/three@0.128.0/examples/js/controls/" + "OrbitControls.js";

            function loadScript(url, callback) {
                const script = document.createElement('script');
                script.src = url;
                script.onload = callback;
                document.head.appendChild(script);
            }

            // Nacheinander laden
            loadScript(cdn1, function() {
                loadScript(cdn2, function() {
                    document.getElementById('status').innerText = "Lade CSV-Daten...";
                    initCSVViewer(); // KORREKTUR: Startet das CSV-Programm
                });
            });
        })();

        // Das Hauptprogramm startet hier
        function initCSVViewer() {
            // 1. Three.js Grund-Setup
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a1a);

            const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
            camera.position.set(150, 150, 150);

            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            const controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            
            // Lichtquellen
            const light = new THREE.DirectionalLight(0xffffff, 1.2);
            light.position.set(200, 400, 300);
            scene.add(light);
            scene.add(new THREE.AmbientLight(0x666666));

            // Hilfsnetz
            const gridHelper = new THREE.GridHelper(500, 50, 0x444444, 0x222222);
            scene.add(gridHelper);

            // Render-Schleife läuft ab Sekunde 1
            function animate() {
                requestAnimationFrame(animate);
                controls.update();
                renderer.render(scene, camera);
            }
            animate();

            // Fallback-Funktion falls daten.csv fehlt (Erzeugt 50 Test-Gebäude)
            function generateDemoCSV() {
                console.log("Generiere künstliche CSV-Demodaten...");
                let csv = "id,x,y,height\n";
                for (let i = 0; i < 50; i++) {
                    // Generiere Gebäude in einem 200x200 Meter Raster
                    const x = Math.random() * 200 - 100;
                    const y = Math.random() * 200 - 100;
                    const height = Math.random() * 30 + 5;
                    csv += `${i},${x},${y},${height}\n`;
                }
                return csv;
            }

            // 2. CSV laden und parsen
            fetch('daten.csv')
                .then(response => {
                    if (!response.ok) throw new Error("CSV-Datei nicht gefunden");
                    return response.text();
                })
                .then(csvText => {
                    parseAndRenderCSV(csvText);
                })
                .catch(err => {
                    console.warn("Echte CSV nicht gefunden. Nutze lokale Demodaten.");
                    document.getElementById('status').innerText = "Demodaten aktiv (daten.csv fehlt)";
                    const demoCSV = generateDemoCSV();
                    parseAndRenderCSV(demoCSV);
                });

            function parseAndRenderCSV(text) {
                const lines = text.split('\n');
                let baseLinesCount = 0;

                const material = new THREE.MeshLambertMaterial({ color: 0x00a8ff });

                // Mathematische Schwerpunktberechnung für alle CSV-Koordinaten
                let parsedPoints = [];
                let sumX = 0, sumY = 0;

                for (let i = 1; i < lines.length; i++) {
                    const line = lines[i].trim();
                    if (!line) continue;

                    const values = line.split(',');
                    const x = parseFloat(values[1]);
                    const y = parseFloat(values[2]);
                    const height = parseFloat(values[3]);

                    if (isNaN(x) || isNaN(y) || isNaN(height)) continue;

                    parsedPoints.push({ x, y, height });
                    sumX += x;
                    sumY += y;
                }

                if (parsedPoints.length === 0) {
                    document.getElementById('status').innerText = "Fehler: Keine gültigen Daten in CSV!";
                    return;
                }

                // Der exakte Mittelpunkt aller Punkte aus der Excel/CSV-Tabelle
                const offsetX = sumX / parsedPoints.length;
                const offsetY = sumY / parsedPoints.length;

                // Gebäude rendern
                parsedPoints.forEach(p => {
                    // Zentrierte Koordinaten berechnen
                    const localX = p.x - offsetX;
                    const localZ = p.y - offsetY; 

                    // 3D-Klotz bauen (Breite: 12m, Tiefe: 12m, Höhe aus CSV)
                    const geometry = new THREE.BoxGeometry(12, p.height, 12);
                    geometry.translate(0, p.height / 2, 0); // Fußpunkt auf den Boden setzen

                    const mesh = new THREE.Mesh(geometry, material);
                    mesh.position.set(localX, 0, localZ);
                    
                    scene.add(mesh);
                    baseLinesCount++;
                });

                if(!document.getElementById('status').innerText.includes("Demodaten")) {
                    document.getElementById('status').innerText = `${baseLinesCount} Gebäude aus CSV gerendert.`;
                }
            }

            // Fenstergröße anpassen
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }
    </script>
</body>
</html>
