<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Option 3: CSV Parser Viewer</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; }
        canvas { width: 100vw; height: 100vh; display: block; }
        .back-btn { position: absolute; top: 20px; left: 20px; background: #333; color: white; padding: 10px 15px; text-decoration: none; border-radius: 5px; z-index: 10; }
        .info-box { position: absolute; bottom: 20px; left: 20px; background: rgba(0,0,0,0.7); color: white; padding: 15px; border-radius: 5px; z-index: 10; }
    </style>
</head>
<body>

    <a href="index.html" class="back-btn">← Zurück zur Hauptseite</a>
    <div class="info-box">
        <h3>CSV 3D-Viewer</h3>
        <p id="status">Lade CSV-Daten...</p>
    </div>

    <!-- Dynamischer Skript-Lader gegen Übertragungsfehler -->
    <script>
        (function() {
            // Teile die Links in sichere Teilstrings auf
            const cdn1 = "https://cdnjs.cloudflare.com" + "/ajax/libs/three.js/r128/" + "three.min.js";
            const cdn2 = "https://cdn.jsdelivr.net" + "/npm/three@0.128.0/examples/js/controls/" + "OrbitControls.js";

            function loadScript(url, callback) {
                const script = document.createElement('script');
                script.src = url;
                script.onload = callback;
                document.head.appendChild(script);
            }

            loadScript(cdn1, function() {
                loadScript(cdn2, function() {
                    document.getElementById('status').innerText = "Lade CSV-Daten...";
                    initCSVViewer();
                });
            });
        })();

        function initCSVViewer() {
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a1a);

            // Kamera weiter hinten positionieren, um das 0-50 Kreuz komplett zu sehen
            const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
            camera.position.set(80, 80, 100);

            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            const controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.target.set(25, 25, 25); // Fokus auf die Mitte des 50er-Raums legen
            
            // Lichtquellen
            const light = new THREE.DirectionalLight(0xffffff, 1.2);
            light.position.set(100, 200, 100);
            scene.add(light);
            scene.add(new THREE.AmbientLight(0x666666));

            // ==========================================
            // KOORDINATENKREUZ ERSTELLEN (0 bis 50)
            // ==========================================
            function createAxisLine(start, end, colorHex) {
                const geometry = new THREE.BufferGeometry().setFromPoints([start, end]);
                const material = new THREE.LineBasicMaterial({ color: colorHex, linewidth: 3 });
                scene.add(new THREE.Line(geometry, material));
            }

            // X-Achse (Rot)
            createAxisLine(new THREE.Vector3(0, 0, 0), new THREE.Vector3(50, 0, 0), 0xff3333);
            // Y-Achse / Höhe (Grün)
            createAxisLine(new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 50, 0), 0x33ff33);
            // Z-Achse / Tiefe (Blau)
            createAxisLine(new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 0, 50), 0x3333ff);

            // Hilfsnetz am Boden zur besseren Orientierung
            const gridHelper = new THREE.GridHelper(100, 20, 0x444444, 0x222222);
            gridHelper.position.set(0, -0.01, 0); // Minimal unter dem Nullpunkt
            scene.add(gridHelper);

            function animate() {
                requestAnimationFrame(animate);
                controls.update();
                renderer.render(scene, camera);
            }
            animate();

            // 2. CSV laden und parsen
            fetch('daten.csv')
                .then(response => {
                    if (!response.ok) throw new Error("CSV nicht gefunden");
                    return response.text();
                })
                .then(csvText => { parseAndRenderCSV(csvText); })
                .catch(err => {
                    document.getElementById('status').innerText = "Demodaten aktiv (Echte CSV fehlt)";
                    // Ihre exakten Realdaten als Direkt-Fallback eingetragen:
                    const realFallbackData = "id,x,y,height\n1,0,0,12\n2,20,5,25\n3,-15,30,8\n4,40,-10,18";
                    parseAndRenderCSV(realFallbackData);
                });

            function parseAndRenderCSV(text) {
                const lines = text.split('\n');
                let baseLinesCount = 0;

                const buildingMaterial = new THREE.MeshLambertMaterial({ color: 0x00a8ff, transparent: true, opacity: 0.85 });
                const anchorMaterial = new THREE.MeshBasicMaterial({ color: 0xff0000 }); // Rote Kugel

                for (let i = 1; i < lines.length; i++) {
                    const line = lines[i].trim();
                    if (!line) continue;

                    const values = line.split(',');
                    const x = parseFloat(values[1]);
                    const y = parseFloat(values[2]);
                    const height = parseFloat(values[3]);

                    if (isNaN(x) || isNaN(y) || isNaN(height)) continue;

                    // Blockgröße definieren (Breite und Tiefe fest auf 12 Einheiten)
                    const blockWidth = 12;
                    const blockDepth = 12;

                    const geometry = new THREE.BoxGeometry(blockWidth, height, blockDepth);
                    
                    // KORREKTUR DER ANKERKANTE:
                    // Wir verschieben die Geometrie so, dass der mathematische Nullpunkt (0,0,0) des Objekts
                    // an der vorderen, linken, unteren Ecke (Kante) sitzt, statt in der Blockmitfe.
                    geometry.translate(blockWidth / 2, height / 2, blockDepth / 2);

                    const mesh = new THREE.Mesh(geometry, buildingMaterial);
                    
                    // In Three.js entspricht CSV-Y der Raum-Tiefe (Z-Achse)
                    // Wir setzen die exakten Rohdaten ohne Verschiebung ein
                    mesh.position.set(x, 0, y);
                    scene.add(mesh);

                    // ROTER ANKERPUNKT: Eine kleine Kugel exakt auf der CSV-Koordinate plotten
                    const sphereGeo = new THREE.SphereGeometry(1, 16, 16);
                    const markerMesh = new THREE.Mesh(sphereGeo, anchorMaterial);
                    markerMesh.position.set(x, 0, y);
                    scene.add(markerMesh);

                    baseLinesCount++;
                }

                document.getElementById('status').innerText = `${baseLinesCount} Gebäude aus CSV gerendert.`;
            }

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }
    </script>
</body>
</html>
