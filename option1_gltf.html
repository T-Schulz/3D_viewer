<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>3D Stadtmodell Dortmund Viewer</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #eeeeee; }
        canvas { width: 100vw; height: 100vh; display: block; }
    </style>
</head>
<body>

    <!-- Dynamischer Skript-Lader mit korrigierten CDN-Subdomänen -->
    <script>
        (function() {
            // Reparierte Pfade mit korrekten Subdomänen (cdnjs. und cdn.)
            const cdn1 = "https://cdnjs.cloudflare.com" + "/ajax/libs/three.js/r128/" + "three.min.js";
            const cdn2 = "https://cdn.jsdelivr.net" + "/npm/three@0.128.0/examples/js/controls/" + "OrbitControls.js";
            const cdn3 = "https://cdn.jsdelivr.net" + "/npm/three@0.128.0/examples/js/loaders/" + "GLTFLoader.js";

            function loadScript(url, callback) {
                const script = document.createElement('script');
                script.src = url;
                script.onload = callback;
                script.onerror = function() {
                    console.error("Fehler beim Laden von: " + url);
                };
                document.head.appendChild(script);
            }

            // Sequentielles Laden der 3D-Bibliotheken
            loadScript(cdn1, function() {
                loadScript(cdn2, function() {
                    loadScript(cdn3, function() {
                        init3DViewer();
                    });
                });
            });
        })();

        // Das Hauptprogramm startet hier
        function init3DViewer() {
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0xeeeeee);

            const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(30, 40, 50);

            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            const controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            const light = new THREE.DirectionalLight(0xffffff, 1);
            light.position.set(1, 1, 1).normalize();
            scene.add(light);
            scene.add(new THREE.AmbientLight(0x666666));

            // Funktion zur Generierung einer Demo-Stadt per Code (Falls GLB fehlt)
            function generateDemoCity() {
                console.log('Generiere künstliches 3D-Stadtmodell als Platzhalter...');
                
                const groundGeo = new THREE.PlaneGeometry(100, 100);
                const groundMat = new THREE.MeshLambertMaterial({ color: 0x999999 });
                const ground = new THREE.Mesh(groundGeo, groundMat);
                ground.rotation.x = -Math.PI / 2;
                scene.add(ground);

                for (let i = 0; i < 15; i++) {
                    const h = Math.random() * 15 + 5;
                    const w = Math.random() * 4 + 3;
                    const geo = new THREE.BoxGeometry(w, h, w);
                    const mat = new THREE.MeshLambertMaterial({ 
                        color: Math.random() * 0xffffff
                    });
                    const building = new THREE.Mesh(geo, mat);
                    
                    building.position.x = Math.random() * 60 - 30;
                    building.position.z = Math.random() * 60 - 30;
                    building.position.y = h / 2;
                    
                    scene.add(building);
                }
            }

            // Render-Schleife (Wird einmal zentral definiert)
            function animate() {
                requestAnimationFrame(animate);
                controls.update();
                renderer.render(scene, camera);
            }

            // 3. Versuche, die echte 3D-Stadtmodell-Datei zu laden
            const loader = new THREE.GLTFLoader();
            loader.load(
                'dortmund_kachel.glb', 
                function (gltf) {
                    scene.add(gltf.scene);
                    console.log('Echtes Dortmund-Stadtmodell geladen!');
                    animate(); // Startet das Rendering nach Erfolg
                }, 
                undefined, 
                function (error) {
                    console.warn('Echte .glb-Datei nicht gefunden. Wechsle zu Demo-Daten.');
                    generateDemoCity();
                    animate(); // Startet das Rendering auch im Fehlerfall mit Demo-Daten
                }
            );

            // Browser-Resizing abfangen
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }
    </script>
</body>
</html>
